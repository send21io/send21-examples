# Publishes ai-sdk-tool-send21 (integrations/vercel-ai-sdk) to npm with
# npm Trusted Publishing (GitHub Actions OIDC). No npm token is used or stored.
#
# Release: bump "version" in integrations/vercel-ai-sdk/package.json, push to main,
# then publish a GitHub release whose tag is ai-sdk-tool-send21-v<version>
# (e.g. ai-sdk-tool-send21-v0.1.2). A manual run publishes the version on the chosen ref.
#
# npmjs.com -> ai-sdk-tool-send21 -> Settings -> Trusted publishing -> GitHub Actions:
#   organization: send21io, repository: send21-examples,
#   workflow filename: publish-ai-sdk-tool.yml, environment: (empty)
name: Publish ai-sdk-tool-send21

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-ai-sdk-tool-send21
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'ai-sdk-tool-send21-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm trusted publishing (OIDC) and provenance
    defaults:
      run:
        working-directory: integrations/vercel-ai-sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest && npm --version

      - name: Check release tag matches package.json version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "ai-sdk-tool-send21-v$VERSION" ]; then
            echo "Tag $TAG does not match package.json version $VERSION" >&2
            exit 1
          fi

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm publish --access public
