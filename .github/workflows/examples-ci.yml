# Offline tests for the examples. No secrets are used; no live API calls are made.
name: Examples CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  calcom-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/calcom-app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test

  fossbilling-adapter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/fossbilling-adapter
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: curl, mbstring
      - run: php -l src/library/Payment/Adapter/Send21.php
      - run: php tests/run.php
