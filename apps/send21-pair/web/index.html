<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121316">
  <!-- One scheme only, never "dark light": with "dark light" and a light system preference, Chromium-based
       forced dark modes (Samsung Internet, Chrome auto dark) treat the page as light and repaint it. theme.js
       switches this to "light only" when the user picks light mode. -->
  <meta name="color-scheme" content="dark only">
  <!-- GitHub Pages sends no headers, so the policy rides in the page. The Node server sends the same as a header. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="send21 pair: ask friends for money and pay them back. You sign in your own wallet. Testnet prototype.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="send21 pair">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>send21 pair · testnet</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <script src="theme.js"></script>
</head>
<body>
  <aside class="testnet" aria-label="Test mode"><span>TESTNET</span><span class="sr"> · test money only, nothing here has value</span></aside>
  <main id="app" tabindex="-1"><div class="skel" aria-busy="true" aria-label="Loading"><span class="sk sk-bar"></span><span class="sk sk-circle"></span><span class="sk sk-line w60"></span><span class="sk sk-big"></span><span class="sk sk-line w40"></span><span class="sk sk-btn"></span></div></main>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript><p class="pad">send21 pair needs JavaScript.</p></noscript>
  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
