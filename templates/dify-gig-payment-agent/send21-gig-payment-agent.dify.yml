          variable: job_summary
        - label: Hours worked
          max_length: null
          options: []
          required: false
          type: number
          variable: hours
        - label: Hourly rate
          max_length: null
          options: []
          required: false
          type: number
          variable: hourly_rate
        - label: Extra costs or fixed price
          max_length: null
          options: []
          required: false
          type: number
          variable: extra_costs
        - label: Currency
          max_length: null
