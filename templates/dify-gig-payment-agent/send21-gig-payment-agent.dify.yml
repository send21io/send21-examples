app:
  description: 'Gig payment agent: turns a finished job into a quote and a send21 crypto pay link priced in your currency, with a message for the client. The client pays from their own wallet; send21 never holds the money.'
  icon: 💸
  icon_background: '#E4FBCC'
  mode: workflow
  name: send21 gig payment agent
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.3.1
workflow:
  conversation_variables: []
  environment_variables:
  - description: send21 API key (s21_...) with drafts:write. Create it at https://send21.io/api-keys
    id: a093b00f-9508-51da-a589-9ba30f980182
    name: SEND21_API_KEY
    selector:
    - env
    - SEND21_API_KEY
    value: ''
    value_type: secret
  - description: Your own Solana address, approved in the send21 app (USDC and USDT on Solana)
    id: ab0bdc11-b751-5dca-b341-042c65dd555e
    name: SEND21_SOLANA_ADDRESS
    selector:
    - env
    - SEND21_SOLANA_ADDRESS
    value: ''
    value_type: string
  - description: Your own Base address, approved in the send21 app (USDC and EURC on Base)
    id: a568f923-b2cf-5786-927c-416e316871b3
    name: SEND21_BASE_ADDRESS
    selector:
    - env
    - SEND21_BASE_ADDRESS
    value: ''
    value_type: string
  - description: Your own Lightning address name@wallet.com (BTC over Lightning)
    id: 55b815c6-024f-5361-a149-07ee8b1d11e9
    name: SEND21_LIGHTNING_ADDRESS
    selector:
    - env
    - SEND21_LIGHTNING_ADDRESS
    value: ''
    value_type: string
