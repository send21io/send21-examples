        targetType: code
      id: send21-source-read-target
      source: send21
      sourceHandle: source
      target: read
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: llm
      id: read-source-message-target
      source: read
      sourceHandle: source
      target: message
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: end
      id: message-source-end-target
      source: message
      sourceHandle: source
      target: end
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: The finished job
        title: Start
        type: start
        variables:
        - label: Client name
          max_length: 80
