        targetType: code
      id: start-source-quote-target
      source: start
      sourceHandle: source
      target: quote
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: http-request
      id: quote-source-send21-target
      source: quote
      sourceHandle: source
      target: send21
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
