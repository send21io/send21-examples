[project]
name = "langchain-send21"
version = "0.1.2"
description = "send21 tools for LangChain. Crypto pay links and API for people and AI agents. The payer signs in their own wallet."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "send21", email = "info@send21.io" }]
requires-python = ">=3.10"
dependencies = ["langchain-core>=0.3,<2", "httpx>=0.27"]
keywords = ["langchain", "tools", "payments", "non-custodial", "send21", "usdc", "bitcoin", "lightning"]

[project.urls]
Homepage = "https://send21.io"
Documentation = "https://send21.io/docs"
Source = "https://github.com/send21io/send21-examples/tree/main/integrations/langchain"
Examples = "https://github.com/send21io/send21-examples"

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = ["PR-DRAFT.md", "LISTING-ISSUE.md"]
